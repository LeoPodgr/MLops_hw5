name: fraud-observability

services:
  redpanda:
    image: redpandadata/redpanda:v24.2.18
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - 1G
      - --reserve-memory
      - 0M
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr
      - internal://redpanda:9092,external://localhost:19092
    ports:
      - "19092:19092"
      - "9644:9644"
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy: *true'"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [fraud-net]

  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fraud_db}
      POSTGRES_USER: ${POSTGRES_USER:-fraud_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fraud_pass_change_me}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./services/sql/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [fraud-net]

  fraud-detector:
    image: fraud-observability-app:local
    build:
      context: .
      dockerfile: services/Dockerfile
    command: ["python", "-m", "fraud_monitoring.scorer"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      TRANSACTIONS_TOPIC: transactions
      SCORING_TOPIC: scoring
      MODEL_DIR: /models
      SCORER_METRICS_PORT: "8000"
      KAFKA_GROUP_ID: fraud-scorer-v1
    ports:
      - "8000:8000"
    volumes:
      - ./model_registry:/models
    depends_on:
      redpanda:
        condition: service_healthy
    restart: unless-stopped
    networks: [fraud-net]

  scoring-writer:
    image: fraud-observability-app:local
    build:
      context: .
      dockerfile: services/Dockerfile
    command: ["python", "-m", "fraud_monitoring.writer"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      SCORING_TOPIC: scoring
      KAFKA_GROUP_ID: fraud-writer-v1
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-fraud_db}
      POSTGRES_USER: ${POSTGRES_USER:-fraud_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fraud_pass_change_me}
      WRITER_METRICS_PORT: "8001"
    ports:
      - "8001:8001"
    depends_on:
      redpanda:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks: [fraud-net]

  transaction-simulator:
    image: fraud-observability-app:local
    build:
      context: .
      dockerfile: services/Dockerfile
    command: ["python", "-m", "fraud_monitoring.simulator"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      TRANSACTIONS_TOPIC: transactions
      SIMULATOR_INTERVAL_SECONDS: ${SIMULATOR_INTERVAL_SECONDS:-0.1}
    depends_on:
      redpanda:
        condition: service_healthy
    restart: unless-stopped
    networks: [fraud-net]

  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - fraud-detector
      - scoring-writer
      - node-exporter
    restart: unless-stopped
    networks: [fraud-net]

  grafana:
    image: grafana/grafana:11.5.2
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ALERTING_ENABLED: "true"
      POSTGRES_USER: ${POSTGRES_USER:-fraud_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fraud_pass_change_me}
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - postgres
    restart: unless-stopped
    networks: [fraud-net]

  node-exporter:
    image: prom/node-exporter:v1.8.2
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    restart: unless-stopped
    networks: [fraud-net]

networks:
  fraud-net:
    driver: bridge

volumes:
  redpanda_data:
  postgres_data:
  prometheus_data:
  grafana_data:
