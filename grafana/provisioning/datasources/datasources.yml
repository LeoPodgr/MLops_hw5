apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 1s

  - name: Fraud PostgreSQL
    uid: postgres
    type: postgres
    access: proxy
    url: postgres:5432
    user: $__env{POSTGRES_USER}
    isDefault: false
    editable: false
    secureJsonData:
      password: $__env{POSTGRES_PASSWORD}
    jsonData:
      database: fraud_db
      sslmode: disable
      postgresVersion: 1600
      timescaledb: false
