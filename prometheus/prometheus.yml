global:
  scrape_interval: 1s
  scrape_timeout: 800ms
  evaluation_interval: 5s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: fraud-detector
    metrics_path: /metrics
    static_configs:
      - targets: ["fraud-detector:8000"]

  - job_name: scoring-writer
    metrics_path: /metrics
    static_configs:
      - targets: ["scoring-writer:8001"]

  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]
